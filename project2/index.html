<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StuTrack – Mentor Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="header">
  <div class="container">
    <h1>StuTrack <span>Mentor</span></h1>
    <nav>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<!-- CLASS SELECT -->
<section class="class-bar">
  <label>Select Class</label>
  <select id="classSelect" onchange="changeClass()">
    <option value="">-- Select Class --</option>
    <option value="Class A">Class A</option>
    <option value="Class B">Class B</option>
    <option value="Class C">Class C</option>
  </select>
</section>

<!-- DASHBOARD -->
<div class="dashboard">

  <!-- LEFT : STUDENT TABLE -->
  <div class="panel left">
    <div class="panel-head">
      <h2 id="classTitle">Students</h2>
      <div>
        <button onclick="showAll()">All</button>
        <button class="danger" onclick="showWeak()">Weak</button>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Roll</th>
          <th>Attendance</th>
          <th>Score</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="studentTable">
        <tr>
          <td colspan="5" class="empty">Select a class to view students</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- RIGHT : ADD STUDENT -->
  <div class="panel right">
    <h3>Add Student</h3>

    <input id="Name" placeholder="Student Name">
    <input id="Rollnumber" placeholder="Roll Number">
    <input id="Address" placeholder="Address">
    <input id="Attendance" type="number" placeholder="Attendance %">
    <input id="Score" type="number" placeholder="Score %">

    <button class="primary" onclick="addStudent()">Add Student</button>
  </div>

</div>

<footer class="footer">
  © 2026 StuTrack
</footer>

<script src="script.js"></script>
</body>
</html>
