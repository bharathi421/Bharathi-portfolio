<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StuTrack</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="container">
    <h1>
      <span class="high">Stu</span><span class="light">Track</span>
    </h1>
    <nav>
      <ul>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>

<!-- CLASS SELECTION -->
<section class="class-section">
  <h2>Select Class</h2>
  <select id="classSelect" onchange="changeClass()">
    <option value="">-- Select Class --</option>
    <option value="Class A">Class A</option>
    <option value="Class B">Class B</option>
    <option value="Class C">Class C</option>
  </select>
</section>

<!-- ADD STUDENT -->
<section id="addSection" class="hidden">
  <h2>Add Student</h2>

  <input type="text" id="Name" placeholder="Student Name">
  <input type="text" id="Rollnumber" placeholder="Roll Number">
  <input type="text" id="Address" placeholder="Address">
  <input type="number" id="Attendance" placeholder="Attendance %">
  <input type="number" id="Score" placeholder="Score %">

  <button onclick="addStudent()">Add Student</button>
</section>

<!-- STUDENT LIST -->
<section id="listSection" class="hidden">
  <h2 id="classTitle"></h2>

  <div class="filter-buttons">
    <button onclick="showAll()">Show All</button>
    <button class="danger" onclick="showWeak()">Show Weak</button>
  </div>

  <div id="studentList"></div>
</section>

<footer>
  <p>&copy; 2026 StuTrack</p>
</footer>

<script src="script.js"></script>
</body>
</html>
